e">Lead contributor across backend and frontend; module structure and role-based access.</text><circle cx="22.5" cy="152.0" r="2.1" fill="#818b98"/><text x="32.0" y="156.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">Designed the pricing and receivables engine: regional price lists, multiple charge bases, automatic recalculation with audit trail.</text><circle cx="22.5" cy="173.0" r="2.1" fill="#818b98"/><text x="32.0" y="177.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">Built survey-to-registry reconciliation with configurable criteria; an indexed matcher cut a 58-second run down to 1.3 s.</text><circle cx="22.5" cy="194.0" r="2.1" fill="#818b98"/><text x="32.0" y="198.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">Implemented the field-staff salary and KPI engine; integrated MISA e-invoicing and SePay / VietQR bank webhooks.</text><rect x="0.0" y="223.0" width="3.0" height="77.0" rx="1.5" fill="#d1d9e0"/><text x="18.0" y="231.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" font-weight="600">V-Life Beauty Clinic — CRM &amp; AI customer-service assistant</text><rect x="759.0" y="217.0" width="121.0" height="22.0" rx="7.0" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="768.0" y="232.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e">04/2026 – 09/2026</text><text x="18.0" y="252.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#818b98">NestJS · PostgreSQL · Socket.IO · Next.js</text><circle cx="22.5" cy="270.0" r="2.1" fill="#818b98"/><text 